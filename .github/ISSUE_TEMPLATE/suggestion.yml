name: Suggestion
description: Suggest a new feature or improvement.
title: "[Suggestion]: "
labels: ["Suggestion", "1.21.1", "26.1.2"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for a new feature or improvement that isn't already part of Thaumaturge. Please keep one suggestion per issue so it can be discussed and tracked clearly.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: This issue covers one suggestion.
          required: true
        - label: I searched existing issues and this hasn't already been suggested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: What need, problem, or gameplay opportunity does this suggestion address?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you have in mind for both Minecraft 1.21.1 and 26.1.2. If it would work differently between versions, explain how.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Screenshots, links, or examples from other versions or mods, if relevant.
    validations:
      required: false
